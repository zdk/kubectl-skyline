name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resubmit to the Krew index
        required: true
permissions:
  contents: write
jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # The release must not fail just because the tap token is missing.
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set, skipping"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zdk/homebrew-tools.git" tap
          ./hack/brew-formula.sh "$GITHUB_REF_NAME" > tap/Formula/kubectl-skyline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A re-run of the same tag has nothing to commit.
          git diff --quiet && exit 0
          git commit -am "kubectl-skyline ${GITHUB_REF_NAME#v}"
          git push
      - name: Update Krew index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
  # Re-run only the Krew step for a release that already exists.
  krew:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # The v0.0.51 action still ships the v0.0.50 image, which ignores the
      # tag input. Run the v0.0.51 image directly; it reads the INPUT_ env.
      - uses: docker://ghcr.io/rajatjindal/krew-release-bot@sha256:a1990089fb0184801af0b0a24931e1537580e97fe9ab79e840582f6c0d37c00c # v0.0.51
        env:
          INPUT_KREW_PLUGIN_RELEASE_TAG: ${{ inputs.tag }}
